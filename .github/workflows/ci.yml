name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Homepage + registry scenarios only. features/account/ drives Clerk's
      # real dev-instance sign-up/sign-in/sign-out UI (rate-limited, capped
      # at 100 users) — run test:bdd:account manually when working on auth,
      # not on every push/PR. See README.md#running-the-scenarios.
      - run: npm run test:bdd:app
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  bearer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Bearer
        uses: bearer/bearer-action@v2
        with:
          format: sarif
          output: results.sarif
      # Bearer emits `results: null` per run instead of `[]` when a run has
      # no findings, which fails upload-sarif's schema validation.
      - name: Normalize SARIF results field
        if: always()
        run: jq '(.runs[].results //= [])' results.sarif > results.sarif.tmp && mv results.sarif.tmp results.sarif
      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
